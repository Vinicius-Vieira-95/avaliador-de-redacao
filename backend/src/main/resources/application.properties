spring.application.name=avaliador-redacao-enem
server.port=8080

# Configurações locais com segredos (fora do Git e do .jar). Veja application-local.properties.example.
# Os dois caminhos cobrem o bootRun (roda em backend/) e a IDE (pode rodar na raiz do projeto).
spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties

# Chave da OpenAI: vem da variável de ambiente OPENAI_API_KEY ou do application-local.properties.
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5-mini}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.timeout=120s

# Limites da redação enviada
avaliacao.texto.min-caracteres=300
avaliacao.texto.max-caracteres=6000

# Histórico das redações (painel de desempenho). Por padrão, um banco H2 em arquivo na pasta do usuário,
# fora do projeto (e do OneDrive). Para PostgreSQL: DB_URL=jdbc:postgresql://..., DB_USUARIO, DB_SENHA e o driver no build.
spring.datasource.url=${DB_URL:jdbc:h2:file:${user.home}/.corretor-redacao-enem/redacoes}
spring.datasource.username=${DB_USUARIO:sa}
spring.datasource.password=${DB_SENHA:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Autenticação com Keycloak. AUTH_HABILITADA=false libera a API sem login (demonstrações sem Keycloak).
app.auth.habilitada=${AUTH_HABILITADA:true}
app.auth.keycloak-url=${KEYCLOAK_URL:http://localhost:8081}
app.auth.realm=${KEYCLOAK_REALM:redacao-enem}
app.auth.client-id=${KEYCLOAK_CLIENT_ID:corretor-frontend}
# O backend valida a assinatura e o emissor dos tokens; as chaves públicas são buscadas no primeiro uso.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${app.auth.keycloak-url}/realms/${app.auth.realm}

# Origens do front Angular autorizadas a chamar a API (separadas por vírgula)
app.cors.origens-permitidas=${CORS_ORIGENS:http://localhost:4200}
