spring.application.name=avaliador-redacao-enem
server.port=8080

# Configurações locais com segredos (fora do Git e do .jar). Veja application-local.properties.example.
# Os dois caminhos cobrem o bootRun (roda em backend/) e a IDE (pode rodar na raiz do projeto).
spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties

# Chave da OpenAI: vem da variável de ambiente OPENAI_API_KEY ou do application-local.properties.
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5-mini}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.timeout=120s

# Limites da redação enviada
avaliacao.texto.min-caracteres=300
avaliacao.texto.max-caracteres=6000

# Origens do front Angular autorizadas a chamar a API (separadas por vírgula)
app.cors.origens-permitidas=${CORS_ORIGENS:http://localhost:4200}
