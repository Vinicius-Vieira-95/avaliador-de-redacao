# Keycloak para desenvolvimento: http://localhost:8081 (console admin: admin / admin).
# O realm "redacao-enem" é importado de ./keycloak na primeira subida.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --http-port=8081 --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8081"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
